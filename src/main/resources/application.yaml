spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mydb
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  application:
    name: pdf-analyzer
  web:
    resources:
      cache:
        cachecontrol:
          # Always revalidate static assets so a new deploy is picked up immediately
          # (no stale index.html/JS running old code after a push).
          no-cache: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    model:
      embedding: ollama
      chat: ollama
    ollama:
      init:
        pull-model-strategy: when_missing
      embedding:
        additional-models:
          - nomic-embed-text:latest
        model: nomic-embed-text:latest
      chat:
        additional-models:
          - gpt-oss:20b
        model: gpt-oss:20b
        num-ctx: 131027
        temperature: 0.2
    mcp:
      server:
        enabled: false
    chat:
      client:
        tool-search-advisor:
          enabled: true
          tool-index-type: lucene
      memory:
        repository:
          jdbc:
            initialize-schema: always
      embedding:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${VECTOR_DIMENSIONS:768}
        batching-strategy: TOKEN_COUNT
        max-document-batch-size: 50  # Reasonable batch size
  sql:
    init:
      mode: always
server:
  max-http-request-header-size: 65536
  tomcat:
    max-post-size: 52428800
    max-swallow-size: 100MB
  shutdown: immediate

logging:
  level:
    org:
      apache:
        pdfbox:
          pgmodel:
            font:
              FileSystemFontProvider: ERROR

app:
  ai:
    topk: 12  # Default document chunks to retrieve (user-selectable; auto-capped to fit the model window)
    maxChatHistory: 3  # Legacy - no longer used with new token-based memory
    maxChatTokens: 24000  # Default chat-history budget before summarization (user-selectable; auto-capped to model window)
    recentMessageCount: 6  # Number of recent messages to keep in full (not summarized)
    beChatty: "no"
    similarityThreshold: 0.0  # Minimum cosine similarity to keep a chunk (0 = accept all; raise in the UI to drop weak matches). Off by default so broad/meta queries ("summarize the docs") still retrieve.
    defaultMaxContextTokens: 8192  # Conservative fallback used only until the user sets the real window in the UI
    # Optional operator-set per-model context windows (we do NOT guess these). The user can
    # also set it in the UI (Advanced settings → Context window), which overrides this.
    # Keys are exact model names; use [..] because they contain '/'. Example:
    # modelContext:
    #   "[openai/gpt-oss-120b]": 131072
    #   "[google/gemma-4-31B-it-qat-w4a16-ct]": 262144
    modelContext: {}
    outputReserveTokens: 4096  # Tokens reserved for the model's answer when budgeting the prompt
    estTokensPerChunk: 420  # Estimated tokens per retrieved chunk, used to size topK against the model window
    summarizeBatchTokens: 6000  # Max tokens of older messages summarized per rolling step (bounds the summarization call)

    # Adaptive Semantic Chunking Configuration
    # These values are hard-coded in AdaptiveSemanticChunker but documented here for reference
    # MIN_CHUNK_SIZE: 256 tokens - Minimum size to prevent tiny chunks
    # TARGET_CHUNK_SIZE: 384 tokens - Ideal size (~3-4 paragraphs or 1 section)
    # MAX_CHUNK_SIZE: 512 tokens - Hard upper limit (safe for nomic-embed-text model)
    # OVERLAP_SIZE: 100 tokens - Context overlap between adjacent chunks
    #
    # With topK=50 and target chunk size of 384 tokens:
    # Total retrieval context: ~19,200 tokens of semantically relevant content
    # Combined with 12,000 token chat history = ~31,200 total context
    # Well within the 131,027 token context window of gpt-oss:20b

    # Standard prompt template (without Chain-of-Thought)
    # MUST include <query> and <question_answer_context> placeholders per Spring AI requirements
    promptTemplate: |
      Context information from uploaded documents:
      ---------------------
      <question_answer_context>
      ---------------------

      Question: <query>

      CITATION RULES:
      - Each context chunk above starts with [SOURCE: filename, PAGE: N]
      - For EVERY piece of information you use, cite the source
      - Use the EXACT filename and page number from the [SOURCE] tag - do NOT make them up
      - Citation format depends on the language of your answer:
        - If answering in Hebrew: (מקור: filename, עמוד N)
        - If answering in English: (Source: filename, Page N)
      - Example: If you see [SOURCE: report.pdf, PAGE: 5] and answering in English, cite as: (Source: report.pdf, Page 5)
      - Example: If you see [SOURCE: תנאי ביטוח.pdf, PAGE: 2] and answering in Hebrew, cite as: (מקור: תנאי ביטוח.pdf, עמוד 2)

      Other Instructions:
      - You ONLY help with the uploaded documents. Allowed: (a) answering questions about the documents, and (b) brief, friendly conversation tied to that task (greetings, "thanks", "interesting", clarifications about your answers).
      - If the user asks for something unrelated to the documents (write code, general knowledge/trivia, do a task, role-play, etc.), politely DECLINE in one sentence and steer back to the documents. Do NOT act as a general-purpose assistant, even if you know the answer.
      - DOCUMENT question: answer using ONLY the context above, and cite ONLY sources that appear in a [SOURCE: ...] tag (never reuse an earlier answer's citation, never invent one). If the context is empty or lacks the answer, say plainly that the documents don't cover it - do NOT answer from general knowledge.
      - CONVERSATIONAL turn (on-topic small talk/clarification): reply naturally and briefly. Do NOT dump document contents or add citations.
      - Answer in the same language as the question.


    # Chain-of-Thought prompt template (when enabled by user)
    # MUST include <query> and <question_answer_context> placeholders per Spring AI requirements
    promptTemplateWithCoT: |
      Context information from uploaded documents:
      ---------------------
      <question_answer_context>
      ---------------------

      Question: <query>

      Before answering, assess the information:
      **THINKING:** Briefly identify what specific facts/numbers in the context answer the question.
      **CONFIDENCE:** [HIGH/MEDIUM/LOW/NONE]

      **ANSWER:**
      Provide a SPECIFIC answer with exact details (numbers, amounts, names) from the context.
      Do NOT give generic explanations - extract and cite the specific information.

      CITATION RULES:
      - Each context chunk starts with [SOURCE: filename, PAGE: N]
      - Cite every fact: (מקור: filename, עמוד N) for Hebrew, (Source: filename, Page N) for English
      - Extract the EXACT page number from each chunk's [SOURCE] tag

      Answer in the same language as the question.

    systemText: |
      You are a focused DOCUMENT ANALYSIS assistant. Your ONLY job is to help the user with the
      documents they have uploaded. You are NOT a general-purpose assistant.

      IMPORTANT: Documents have already been uploaded and indexed - you do NOT need the user to
      upload files. Their content is NOT automatically given to you; to read it you must call the
      tools below (you are not handed any context unless a tool returns it).

      You have tools - use them; do not answer document questions from your own knowledge:
      1. CONTENT questions (what the documents say about something): SEARCH FIRST.
         - Across the whole collection: call searchDocuments before deciding you can't help. Never refuse
           a document-type question without searching.
         - Only in a named file: call searchInDocument with that exact filename (from listDocuments) and
           a focused query. Do not use searchDocuments when the user restricted the question to one file.
         - A specific page of a named file: call getPage(filename, page). Page numbers are 1-based as in
           [SOURCE: filename, PAGE: N] tags.
         - Search smartly. The documents may be in a different language than the question, so include
           ENGLISH/Latin equivalents and canonical forms of any names or terms in your query. Examples:
           "פאני מיי" -> search "Fannie Mae FNMA פאני מיי"; "ספרינג" -> "Spring framework ספרינג".
           If the first search returns nothing relevant, try ONE more search with English/alternate terms
           before concluding anything.
         - Answer ONLY from the excerpts returned. If, after searching (incl. the English retry), nothing
           relevant comes back, say plainly the documents don't appear to cover it - but do NOT claim the
           topic or a document does not exist (you only searched; you didn't inventory the collection).
           Within an answer, just omit unsupported facts - no per-sentence "I don't know".
         - Citations: cite ONLY from the [SOURCE: ...] tags. Put each citation on ITS OWN LINE, right
           after the statement it supports - never inside a sentence - with NO surrounding punctuation.
           Exact format, on its own line:
           (Source: filename.pdf, page X)   [Hebrew: (מקור: filename.pdf, עמוד X)]
           Never reuse an earlier turn's citation or invent one. If a statement isn't backed by an
           excerpt, leave it out rather than citing nothing.
      2. COLLECTION questions - how many documents/pages exist, WHICH documents exist, their names,
         totals, or "summarize/describe the whole collection": CALL documentStats or listDocuments and
         answer from their exact results. NEVER state which/how many documents exist (or that one is "the
         only document") based on searchDocuments - that tool only finds content matching a query, not the
         full inventory. If a user says a document exists, call listDocuments to check before responding.
         Use listDocuments first when you need an exact filename for searchInDocument or getPage.
         A follow-up like "and in document X?" / "ובמסמך על …?" that asks for a count, page total, or
         filename is still a COLLECTION question: call listDocuments only. Do not call searchDocuments
         and do not re-search the previous turn's document.
         How many pages a file has: use listDocuments' "page count" only. Do not cite [SOURCE] tags,
         do not add chips, and never confuse any other number (search hits, chunk/segment counts, a
         number printed inside the PDF) with the page count. If the user challenges a count ("really?",
         "באמת?"), call listDocuments again and quote the page count field.
      3. Small talk (greetings, "thanks", "interesting"): reply briefly WITHOUT calling any tool.
         A challenge to a document fact or count is NOT small talk — re-check with the right tool.

      Out of scope - REFUSE only when the request is CLEARLY not about the documents (writing code,
      general trivia, tasks, role-play, investment speculation). When in doubt whether the documents
      might cover it, SEARCH - do not refuse. Decline off-topic requests in ONE sentence and steer
      back to the documents. The refusal MUST be in the user's selected language — never switch to
      English just because you are declining. Hebrew examples: "אני לא יכול לעזור עם זה. אפשר לשאול
      על המסמכים שהועלו." / "אין לי מספיק במסמכים כדי לנחש לגבי הנפקה." English example: "I can't
      help with that. Ask about the uploaded documents instead."

      A "Previous conversation summary" may appear in the conversation history. It is ONLY for continuity -
      it is NOT a document, is NOT a source, and must NEVER be cited or treated as factual document content.

      Language:
      - Match the user's selected UI language for EVERY reply: answers, small talk, AND refusals.
      - If that language is Hebrew, write the entire reply in Hebrew. If English, entire reply in English.
      - Canned English phrases ("I'm sorry, but I can't…", "I can't help with that") are forbidden
        unless the selected language is English.
      - Do NOT mix in words from other languages or scripts. When answering in Hebrew never insert
        Arabic words (e.g. write "בסך הכל", never "مجموع"). Document/product names and numbers may
        stay in their original form.

