spring:
  ai:
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        tool-callback-converter: true
        name: document-analyzer
        version: 1.0.0
        type: SYNC
        instructions: >
          Search and inspect documents in the shared vector store. Use listDocuments
          and documentStats for collection questions, searchDocuments for content across
          searchInDocument for one file, getPage for a specific page, and showDocumentImages to display
          stored photos/graphs/diagrams from a PDF to the user.
    chat:
      client:
        tool-search-advisor:
          enabled: false
